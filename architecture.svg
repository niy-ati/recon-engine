stem, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B1F33" text-anchor="middle">Pass 4</text><text x="450.0" y="619.0" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#57606A" text-anchor="middle">Confidence gated arbiter, a model picks one candidate off that shortlist</text><line x1="450.0" y1="632" x2="450.0" y2="652" stroke="#57606A" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="652" width="860" height="70" rx="10" fill="#0099FF" stroke="#0077CC" stroke-width="1.6"/><text x="450.0" y="683.0" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Validation Gate</text><text x="450.0" y="703.0" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#EAF6FF" text-anchor="middle">confidence above 0.90 AND the model tier is on an explicit trusted list</text><line x1="448.0" y1="722" x2="230.0" y2="756" stroke="#57606A" stroke-width="2" marker-end="url(#arrow)"/><line x1="452.0" y1="722" x2="670.0" y2="756" stroke="#57606A" stroke-width="2" marker-end="url(#arrow)"/><text x="330.0" y="733.0" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#57606A" text-anchor="middle">both true</text><text x="570.0" y="733.0" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#57606A" text-anchor="middle">either fails</text><rect x="20" y="756" width="420.0" height="58" rx="10" fill="#FFFFFF" stroke="#1F9D55" stroke-width="1.6"/><text x="230.0" y="781.0" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0B1F33" text-anchor="middle">Auto Applied</text><text x="230.0" y="801.0" font-family="'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight=