<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 960" width="860" height="960">
<rect x="0" y="0" width="860" height="960" fill="#FFFFFF"/>
<text x="30" y="44" font-family="'Inter',-apple-system,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" fill="#0074C2">READS THREE SOURCES</text><text x="30" y="74" font-family="'Inter',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15.5" fill="#1B202D">Razorpay Settlement Recon API  ·  Bank statement CSV  ·  Internal ledger CSV</text><line x1="44" y1="120" x2="44" y2="160" stroke="#DDE3E9" stroke-width="2"/><text x="30" y="154" font-family="'Inter',-apple-system,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" fill="#0074C2">SEVEN MATCHING PASSES, CHEAPEST AND MOST CERTAIN FIRST</text><circle cx="44" cy="190" r="6" fill="#0099FF" stroke="#0099FF" stroke-width="2"/><text x="76" y="196" font-family="'Inter Tight','Inter',-apple-system,'Segoe UI',sans-serif" font-size="19" font-weight="700" letter-spacing="-0.01em" fill="#1B202D">Pass 1</text><text x="76" y="218" font-family="'Inter',-apple-system,'Segoe UI',Arial,sans-serif" font-size="14.5" font-weight="450" fill="#636E7E">Settlement to bank, UTR + amount + date. Resolves the two tier UTR case.</text><line x1="44" y1="196" x2="44" y2="246" stroke="#DDE3E9" stroke-width="2"/><circle cx="44" cy="252" r="6" fill="#0099FF" stroke="#0099FF" stroke-width="2"/><text x="76" y="258" font-family="'Inter Tight','Inter',-apple-system,'Segoe UI',sans-serif" font-size="19" font-weight="700" letter-spacing="-0.01em" fill="#1B202D">Pass 2</text><text x="76" y="280" font-family="'Inter',-apple-system,'Segoe UI',Arial,sans-serif" font-size="14.5" font-weight="450" fill="#636E7E">Settlement to ledger, order_id, indexed lookup.</text><line x1="44" y1="258" x2="44" y2="308" stroke="#DDE3E9" stroke-width="2"/><circle cx="44" cy="314" r="6" fill="#0099FF" stroke="#0099FF" stroke-width="2"/><text x="76" y="320" font-family="'Inter Tight','Inter',-apple-system,'Segoe UI',sans-serif" font-size="19" font-weight="700" letter-spacing="-0.01em" fill="#1B202D">Pass 2.5</text><text x="76" y="342" font-family="'Inter',-apple-system,'Segoe UI',Arial,sans-serif" font-size="14.5" font-weight="450" fill="#636E7E">Learned pattern lookup, a narration a human already confirmed.</text><line x1="44" y1="320" x2="44" y2="370" stroke="#DDE3E9" stroke-width="2"/><circle cx="44" cy="376" r="6" fill="#0099FF" stroke="#0099FF" stroke-width="2"/><text x="76" y="382" font-family="'Inter Tight','Inter',-apple-system,'Segoe UI',sans-serif" font-size="19" font-weight="700" letter-spacing="-0.01em" fill="#1B202D">Pass 2.6</text><text x="76" y="404" font-family="'Inter',-apple-system,'Segoe UI',Arial,sans-serif" font-size="14.5" font-weight="450" fill="#636E7E">Learned template lookup, same recurring narration, a different order's reference.</text><line x1="44" y1="382" x2="44" y2="432" stroke="#DDE3E9" stroke-width="2"/><circle cx="44" cy="438" r="6" fill="#0099FF" stroke="#0099FF" stroke-width="2"/><text x="76" y="444" font-family="'Inter Tight','Inter',-apple-system,'Segoe UI',sans-serif" font-size="19" font-weight="700" letter-spacing="-0.01em" fill="#1B202D">Pass 2.75</text><text x="76" y="466" font-family="'Inter',-apple-system,'Segoe UI',Arial,sans-serif" font-size="14.5" font-weight="450" fill="#636E7E">Exact digit reference, an unambiguous order number in free text.</text><line x1="44" y1="444" x2="44" y2="494" stroke="#DDE3E9" stroke-width="2"/><circle cx="44" cy="500" r="6" fill="#0099FF" stroke="#0099FF" stroke-width="2"/><text x="76" y="506" font-family="'Inter Tight','Inter',-apple-system,'Segoe UI',sans-serif" font-size="19" font-weight="700" letter-spacing="-0.01em" fill="#1B202D">Pass 3</text><text x="76" y="528" font-family="'Inter',-apple-system,'Segoe UI',Arial,sans-serif" font-size="14.5" font-weight="450" fill="#636E7E">Fuzzy candidate narrowing. Builds a shortlist only, decides nothing.</text><line x1="44" y1="506" x2="44" y2="556" stroke="#DDE3E9" stroke-width="2"/><circle cx="44" cy="562" r="6" fill="#0099FF" stroke="#0099FF" stroke-width="2"/><text x="76" y="568" font-family="'Inter Tight','Inter',-apple-system,'Segoe UI',sans-serif" font-size="19" font-weight="700" letter-spacing="-0.01em" fill="#1B202D">Pass 4</text><text x="76" y="590" font-family="'Inter',-apple-system,'Segoe UI',Arial,sans-serif" font-size="14.5" font-weight="450" fill="#636E7E">Confidence gated arbiter. A model picks one candidate off that shortlist.</text><line x1="44" y1="622" x2="44" y2="654" stroke="#DDE3E9" stroke-width="2"/><text x="30" y="648" font-family="'Inter',-apple-system,'Segoe UI',Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.2" fill="#0074C2">THE ONLY POINT A MODEL IS CONSULTED</text><circle cx="44" cy="688" r="6" fill="#0099FF" stroke="#0099FF" stroke-width="2"/><text x="76" y="694" font-family="'Inter Tight','Inter',-apple-system,'Segoe UI',sans-serif" font-size="20" font-weight="800" letter-spacing="-0.01em" fill="#1B202D">Validation gate</text><text x="76" y="716" font-family="'Inter',-apple-system,'Segoe UI',Arial,sans-serif" font-size="14.5" font-weight="450" fill="#636E7E">Auto applies only if confidence is above 0.90 AND the model tier is on an explicit trusted list.</text><line x1="44" y1="712" x2="44" y2="742" stroke="#DDE3E9" stroke-width="2"/><circle cx="44" cy="742" r="5" fill="#008F47" stroke="#008F47" stroke-width="2"/><text x="76" y="747" font-family="'Inter',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="600" fill="#1B202D">Auto applied</text><text x="226" y="747" font-family="'Inter',-apple-system,'Segoe UI',Arial,sans-serif" font-size="14" fill="#636E7E">never taken today, see AI Usage and Validation</text><line x1="44" y1="747" x2="44" y2="776" stroke="#DDE3E9" stroke-width="2"/><circle cx="44" cy="776" r="5" fill="#E05E00" stroke="#E05E00" stroke-width="2"/><text x="76" y="781" font-family="'Inter',-apple-system,'Segoe UI',Arial,sans-serif" font-size="15" font-weight="600" fill="#1B202D">Human review queue</text><text x="271" y="781" font-family="'Inter',-apple-system,'Segoe UI',Arial,sans-serif" font-size="14" fill="#636E7E">confirm, reject, or annotate</text><line x1="44" y1="781" x2="44" y2="856" stroke="#DDE3E9" stroke-width="2"/><circle cx="44" cy="856" r="6" fill="#0099FF" stroke="#0099FF" stroke-width="2"/><text x="76" y="862" font-family="'Inter Tight','Inter',-apple-system,'Segoe UI',sans-serif" font-size="19" font-weight="700" letter-spacing="-0.01em" fill="#1B202D">SQLite persistence</text><text x="76" y="884" font-family="'Inter',-apple-system,'Segoe UI',Arial,sans-serif" font-size="14.5" font-weight="450" fill="#636E7E">Every decision keeps a full structured replay log.</text><line x1="44" y1="862" x2="44" y2="910" stroke="#DDE3E9" stroke-width="2"/><circle cx="44" cy="910" r="6" fill="#0099FF" stroke="#0099FF" stroke-width="2"/><text x="76" y="916" font-family="'Inter Tight','Inter',-apple-system,'Segoe UI',sans-serif" font-size="19" font-weight="700" letter-spacing="-0.01em" fill="#1B202D">Review application</text><text x="76" y="938" font-family="'Inter',-apple-system,'Segoe UI',Arial,sans-serif" font-size="14.5" font-weight="450" fill="#636E7E">The local site this repository ships. Confirm or reject any open row.</text>
</svg>