<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2460 524" width="2460" height="524" role="img" aria-label="A settlement row flows through three sources into six deterministic matching passes; only what none of them resolve reaches a confidence-gated model, which is still checked by a human before it counts as resolved. Every decision is persisted, and a human confirmation feeds back into the pattern store so the same case never needs a model again.">
